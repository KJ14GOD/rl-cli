# Starter PPO config generated by `rlx init`.
run_name: cartpole_ppo
seed: 42
device: cpu

env:
  id: CartPole-v1
  num_envs: 4

algo:
  name: ppo
  total_timesteps: 50000
  rollout_steps: 128
  batch_size: 256
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  update_epochs: 4

policy:
  type: mlp
  hidden_sizes: [128, 128]

checkpoint:
  save_every: 10000

eval:
  every: 10000
  episodes: 10
  deterministic: true
