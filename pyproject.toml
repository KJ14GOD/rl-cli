[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "rlx-workbench"
version = "0.2.0"
description = "Local-first CLI for reinforcement learning experiments."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "gymnasium>=1.0,<2.0",
  "matplotlib>=3.8,<4.0",
  "pygame>=2.6,<3.0",
  "pydantic>=2.11,<3.0",
  "rich>=13.9,<14.0",
  "stable-baselines3>=2.7,<3.0",
  "typer>=0.15,<1.0",
  "pyyaml>=6.0.2,<7.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2.0",
  "hatchling>=1.27,<2.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.11,<0.12",
  "twine>=6.0,<7.0",
]

[project.scripts]
rlx = "rlx.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rlx"]
include = [
  "src/rlx/templates/**/*.yaml",
  "src/rlx/templates/project/.env.example",
  "src/rlx/templates/project/.gitignore",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
