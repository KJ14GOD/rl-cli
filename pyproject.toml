[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "rlcli"
version = "0.1.0"
description = "Local-first CLI for reinforcement learning experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "rich>=13.9,<14.0",
  "typer>=0.15,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "ruff>=0.11,<0.12",
]

[project.scripts]
rlx = "rlx.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rlx"]
include = ["src/rlx/templates/**/*.yaml"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
