# Classic Control PPO config generated by `rlx init`.
# MountainCar-v0 is sparse-reward; increase total_timesteps for serious runs.
run_name: mountain_car_ppo
seed: 42
device: cpu

env:
  id: MountainCar-v0
  num_envs: 4

algo:
  name: ppo
  total_timesteps: 100000
  rollout_steps: 128
  batch_size: 256
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  update_epochs: 4

policy:
  type: mlp
  hidden_sizes: [128, 128]

checkpoint:
  save_every: 20000

eval:
  every: 20000
  episodes: 10
  deterministic: true
